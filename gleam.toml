name = "gleeter"
version = "1.0.0"
description = "Show XKCD comics right in your terminal!"
licenses = ["MIT"]
repository = { type = "github", user = "massix", repo = "gleeter" }

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_hackney = ">= 1.3.1 and < 2.0.0"
gleam_json = ">= 2.3.0 and < 4.0.0"
birl = ">= 1.9.0 and < 3.0.0"
simplifile = ">= 2.2.1 and < 3.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
argv = ">= 1.0.2 and < 2.0.0"
sqlight = ">= 1.0.1 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.0.2 and < 2.0.0"
term_size = ">= 1.0.1 and < 2.0.0"
messua = ">= 2.0.0 and < 3.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
tom = ">= 2.0.0 and < 3.0.0"
themis = ">= 4.0.0 and < 5.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
birdie = ">= 1.3.1 and < 2.0.0"
pprint = ">= 1.0.5 and < 2.0.0"
gleam_regexp = ">= 1.1.1 and < 2.0.0"
