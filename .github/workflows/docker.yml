name: Build and push Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  DOCKERHUB_USER: massix86
  DOCKERHUB_REPOSITORY: gleeter
jobs:
  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: nicknovitski/nix-develop@v1
      - uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-qemu-action@v3
      - run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DOCKERHUB_USER" --password-stdin
          make docker DOCKER_PLATFORM=linux/amd64,linux/arm64
          docker push --all-tags "$DOCKERHUB_USER/$DOCKERHUB_REPOSITORY"
        name: Build and push docker images
